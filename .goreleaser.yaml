version: 2

project_name: git-crux

before:
  hooks:
    - go mod tidy

builds:
  - id: git-crux
    main: .
    binary: git-crux
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

# Sign and notarize the darwin binaries so macOS Gatekeeper does not refuse a
# tarball downloaded straight from the releases page. Uses goreleaser's
# cross-platform (quill) implementation, so no macOS runner is needed. The
# enabled guard keeps snapshot and fork builds working when the secrets are
# absent; both the certificate and the notary key are required, since signing
# without usable notary credentials would fail the release outright.
notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_NOTARY_KEY") }}'
      ids:
        - git-crux
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

homebrew_casks:
  # No suffix needed here: neither homebrew-core nor homebrew-cask owns the
  # `git-crux` token, so the cask and the installed command share a name.
  - name: git-crux
    binaries: [git-crux]
    repository:
      owner: jonhadfield
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jonhadfield/git-crux
    description: AI commit-message reviewer that checks your message against the staged diff
    # The darwin binaries are signed and notarized, but a notarization
    # ticket cannot be stapled into a bare Mach-O executable, so Gatekeeper
    # reports "Notary Ticket Missing" and blocks first run. Casks set the
    # quarantine flag on download, so clear it here.
    #
    # goreleaser's hooks.post.install emits a `postflight` block, which Homebrew
    # 7 deprecates in favour of `postflight_steps`, warning on every install and
    # update. That is not a rename: postflight_steps takes declarative steps
    # rather than arbitrary Ruby, so the body is rewritten and injected through
    # custom_block instead. Revert to hooks once goreleaser emits
    # postflight_steps itself.
    custom_block: |
      # staged_path is a Homebrew template token, not the Ruby method the
      # postflight block used, and goreleaser renders this through Go's
      # templating first, so the braces are escaped to survive it.
      postflight_steps do
        run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ `{{staged_path}}` }}/git-crux"], must_succeed: false
      end
